<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Talha Talukdar — Software Engineering, Full-Stack Development, AI and ML" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#1a2748"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="82%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#glowGrad)"/>

  <!-- faint dot grid, top strip -->
  <g fill="#5eead4" opacity="0.12">
    <circle cx="40" cy="28" r="1.6"/><circle cx="70" cy="28" r="1.6"/><circle cx="100" cy="28" r="1.6"/>
    <circle cx="130" cy="28" r="1.6"/><circle cx="160" cy="28" r="1.6"/><circle cx="190" cy="28" r="1.6"/>
    <circle cx="40" cy="52" r="1.6"/><circle cx="70" cy="52" r="1.6"/><circle cx="100" cy="52" r="1.6"/>
  </g>

  <!-- decorative node graph, right side (AI / systems motif) -->
  <g stroke="#3fb9ac" stroke-width="1" opacity="0.45" fill="none">
    <line x1="760" y1="70" x2="845" y2="45"/>
    <line x1="845" y1="45" x2="930" y2="80"/>
    <line x1="845" y1="45" x2="880" y2="130"/>
    <line x1="930" y1="80" x2="1010" y2="55"/>
    <line x1="930" y1="80" x2="985" y2="150"/>
    <line x1="880" y1="130" x2="985" y2="150"/>
    <line x1="985" y1="150" x2="1075" y2="120"/>
    <line x1="1010" y1="55" x2="1090" y2="70"/>
    <line x1="1075" y1="120" x2="1090" y2="70"/>
    <line x1="1075" y1="120" x2="1120" y2="190"/>
    <line x1="880" y1="130" x2="820" y2="200"/>
    <line x1="985" y1="150" x2="950" y2="225"/>
  </g>
  <g fill="#5eead4">
    <circle cx="760" cy="70" r="3.5" opacity="0.7"/>
    <circle cx="845" cy="45" r="4" opacity="0.85"/>
    <circle cx="930" cy="80" r="3.5" opacity="0.7"/>
    <circle cx="1010" cy="55" r="3" opacity="0.6"/>
    <circle cx="880" cy="130" r="4.5" opacity="0.9"/>
    <circle cx="985" cy="150" r="4" opacity="0.85"/>
    <circle cx="1075" cy="120" r="3.5" opacity="0.7"/>
    <circle cx="1090" cy="70" r="3" opacity="0.6"/>
    <circle cx="1120" cy="190" r="3" opacity="0.55"/>
    <circle cx="820" cy="200" r="3.5" opacity="0.65"/>
    <circle cx="950" cy="225" r="3" opacity="0.6"/>
  </g>

  <!-- code bracket, faint, large, right background -->
  <text x="1000" y="255" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="150" font-weight="700" fill="#5eead4" opacity="0.05" text-anchor="middle">&lt;/&gt;</text>

  <!-- name -->
  <text x="60" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1.5" fill="#f8fafc">TALHA TALUKDAR</text>

  <!-- accent rule -->
  <rect x="62" y="150" width="330" height="3" fill="url(#ruleGrad)"/>

  <!-- role line -->
  <text x="62" y="188" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="19" fill="#5eead4">Software Engineering &#8226; Full-Stack Development &#8226; AI &amp; ML</text>

  <!-- tagline -->
  <text x="62" y="220" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" fill="#94a3b8">// Build &#8226; Learn &#8226; Research &#8226; Improve</text>

  <!-- base rule -->
  <rect x="0" y="278" width="1200" height="2" fill="#1e2a4a"/>
</svg>
